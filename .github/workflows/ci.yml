name: CI

# Fast build/lint/unit-test for this repo only (Wayfinder repo-hygiene ticket
# 2 split this out of nervly-base's central ci.yml). Checks out nervly-docs
# as a fixture for its committed OpenAPI spec (check:codegen and
# check:release, both run by `npm run check`, read it). `release.yml`
# (tag-triggered publish) is separate and unaffected. The genuinely
# cross-repo gates that touch this repo (docs' portal snippet/
# conformance suite, infra-hardening) stay centralized in nervly-base and are
# unaffected by this file — a manual run of this workflow can still trigger
# them via the repository_dispatch below.
#
# The pre-commit hooks are the actual gate (types, tests, build, secrets,
# audit) and run on every developer's machine before a commit is made. The
# hooks-drift-gate job below does not re-run that chain — it only asserts the
# hook wiring itself hasn't drifted: that the hook file still exists and that
# `npm ci` still runs it (via the `prepare` script), so a change can't
# silently remove local enforcement without anyone noticing in review.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk:
    name: SDK — Typecheck & Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the pinned toolchain are both exercised.
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      # check-codegen.mjs and check-release.mjs (both run by `npm run check`)
      # read ../nervly-docs/static/openapi/gateway.json — a real dependency
      # hidden inside the npm scripts, discovered by an actual CI failure on
      # this ticket's own feature branch, not by static reading of the job's
      # steps.
      - name: Checkout nervly-docs (OpenAPI spec fixture)
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/nervly-docs.git" \
            ../nervly-docs
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # `npm run check` also runs the release-discipline gates (Ticket 20):
      # changelog/version agreement, the deprecation registry, and the
      # provenance/audit/SBOM/disclosure-policy wiring.
      - name: sdk
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm test
      # README-as-tested gate (checklist.md Documentation#01): the README's
      # typescript snippets are extracted and type-checked against the SDK
      # sources through tsconfig.check.json (like examples/**), and its
      # documented base URL / version / webhooks warning must agree with the
      # nervly-docs content — the sibling checkout above is the fixture for
      # both halves.
      - name: sdk README gate (snippets + docs agreement)
        run: npm run check:readme
      # Supply-chain floor (Ticket 20): the runtime dependency audit and the
      # release SBOM run on every push, and the tagged release workflow
      # (.github/workflows/release.yml) re-runs both before publishing.
      - name: sdk supply-chain gate (audit + SBOM)
        run: |
          npm run audit
          npm run sbom
      # Packaging gate (Ticket 11): packs the tarball, installs it into a
      # scratch project, and proves `@nervly/sdk` resolves and type-checks
      # both as ESM and as CJS. `npm test` already asserted the manifest shape
      # and the `import`/`require` conditions; this is the end-to-end proof that
      # the published artifact actually loads through the resolver a consumer
      # uses rather than through a relative path into dist/.
      - name: sdk packaging gate (dual ESM/CJS + type resolution)
        run: npm run check:exports
      # Wayfinder repo-hygiene ticket 2: after a manual run of this workflow,
      # tells nervly-base's central workflow to run its cross-repo contract
      # gates against this commit instead of waiting for the next manual run
      # there or a full `make push-all`.
      - name: Notify nervly-base (repository_dispatch)
        if: github.event_name == 'workflow_dispatch' && matrix.node-version == 26
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/nervly-base/dispatches" \
            -d '{"event_type":"service-updated","client_payload":{"repo":"nervly-js","ref":"${{ github.ref_name }}"}}'

  hooks-drift-gate:
    name: Pre-commit hook wiring is intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Assert .husky/pre-commit exists
        run: |
          set -euo pipefail
          if [ ! -f .husky/pre-commit ]; then
            echo "::error::.husky/pre-commit is missing"
            exit 1
          fi
          echo ".husky/pre-commit is present"

      - name: Assert package.json prepare script installs husky
        run: |
          set -euo pipefail
          prepare="$(node -p "require('./package.json').scripts.prepare")"
          if [ "$prepare" != "husky" ]; then
            echo "::error::package.json scripts.prepare is '${prepare}', expected 'husky'"
            exit 1
          fi
          echo "scripts.prepare is 'husky'"
